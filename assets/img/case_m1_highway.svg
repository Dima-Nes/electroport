<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="m1Sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="canopyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e5a6b"/>
      <stop offset="100%" stop-color="#00a8b5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#m1Sky)"/>
  <!-- Distant Trees and Highway Horizon -->
  <path d="M0 240 C150 235 300 242 450 236 C600 232 720 240 800 238 L800 280 L0 280 Z" fill="#bbf7d0"/>
  <!-- Highway Road Strip -->
  <polygon points="0,280 800,280 800,450 0,450" fill="#334155"/>
  <!-- Lane markings -->
  <line x1="0" y1="360" x2="800" y2="360" stroke="#f8fafc" stroke-width="4" stroke-dasharray="30 20"/>
  <!-- Gas Station Canopy -->
  <polygon points="180,130 680,100 710,130 210,160" fill="url(#canopyGrad)"/>
  <rect x="230" y="150" width="14" height="140" fill="#64748b"/>
  <rect x="630" y="120" width="14" height="170" fill="#64748b"/>
  <!-- Ultra-Fast High-Power EV Charger -->
  <g transform="translate(400, 190)">
    <rect x="0" y="0" width="55" height="110" rx="6" fill="#ffffff" stroke="#00a8b5" stroke-width="3"/>
    <rect x="8" y="12" width="39" height="28" rx="3" fill="#0f172a"/>
    <text x="27" y="30" font-family="sans-serif" font-size="11" font-weight="900" fill="#10b981" text-anchor="middle">150 kW</text>
    <circle cx="27" cy="56" r="6" fill="#00a8b5"/>
    <rect x="12" y="72" width="31" height="6" rx="2" fill="#cbd5e1"/>
    <!-- Heavy Duty Cable -->
    <path d="M55 50 C75 50 85 80 85 110" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
    <rect x="75" y="105" width="20" height="14" rx="3" fill="#00a8b5"/>
  </g>
  <!-- Concrete Island & Crash Bollards -->
  <rect x="350" y="295" width="160" height="20" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="365" y="270" width="10" height="30" rx="3" fill="#f59e0b" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="485" y="270" width="10" height="30" rx="3" fill="#f59e0b" stroke="#0f172a" stroke-width="1.5"/>
</svg>